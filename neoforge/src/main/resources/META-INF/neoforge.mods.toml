modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
displayURL="${homepage_url}"
logoFile="assets/${mod_id}/NeoforgeIcon.png"
credits="${credits}"
authors = ${mod_authors}
description = '''${description} | NeoForge Version'''

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type="required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "SERVER"

[[dependencies.${mod_id}]]
modId = "minecraft"
type="required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Personal Notes:
# "type" in dependencies can be: required, optional, imcompatible, discouraged

